[project]
name = "currency-exchange"
version = "0.1.0"
description = ""
authors = [
    {name = "Anikavuk",email = "usla_2018@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.116.0,<0.117.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "ruff (>=0.12.2,<0.13.0)"
]
[tool.ruff]
select = ["E", "W", "F"]  # Включить проверки PEP8
ignore = ["E501"]         # Игнорировать длинные строки
line-length = 79          # Максимальная длина строки

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
