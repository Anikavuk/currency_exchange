services:
  postgres:
      container_name: db_postgres
      image: postgres:14-alpine
      env_file:
        - .env
      ports:
        - "9456:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data/
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
volumes:
  pgdata:
